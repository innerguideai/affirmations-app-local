<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>My Profile • AI Affirm</title>

    <link rel="stylesheet" href="/css/style.css?v=2026-01-16-2" />
    <link rel="stylesheet" href="/css/profile.css?v=2026-01-16-2" />
    <link rel="stylesheet" href="/css/emotion-dashboard.css?v=2026-03-25-1" />
    <link rel="stylesheet" href="/css/utils.css?v=2026-03-25-1" />

    <style>
      .ig-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
      }

      .ig-dt {
        opacity: 0.85;
      }

      .ig-dd {
        margin: 0;
        font-weight: 700;
        text-align: right;
        max-width: 60%;
        word-break: break-word;
      }

      .my-profile-shell {
        width: calc(100% - 32px);
        max-width: 680px;
        box-sizing: border-box;
        padding-left: 22px;
        padding-right: 22px;
      }

      #profileCard {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        box-sizing: border-box;
      }

      .ig-profile-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 18px;
        padding: 12px 0;
      }

      .ig-profile-btn {
        border: 0;
        border-radius: 8px;
        min-height: 42px;
        padding: 9px 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .ig-profile-btn:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .ig-profile-btn-primary {
        background: rgba(255, 255, 255, 0.92);
        color: #1f2933;
      }

      .ig-profile-btn-secondary {
        background: rgba(255, 255, 255, 0.35);
        color: inherit;
      }

      .ig-profile-form {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        margin: 10px auto 0;
        padding: 2px 4px 8px;
      }

      .ig-profile-field {
        display: grid;
        gap: 8px;
        margin: 0 0 18px 0;
        box-sizing: border-box;
      }

      .ig-profile-field label {
        font-size: 13px;
        opacity: 0.85;
      }

      .ig-profile-field input,
      .ig-profile-field select {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 8px;
        min-height: 42px;
        padding: 9px 16px;
        font: inherit;
      }

      .ig-profile-email-readonly {
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        padding: 9px 0;
        font-weight: 700;
        word-break: break-word;
      }

      .ig-profile-form .ig-profile-actions {
        margin-top: 2px;
        padding-bottom: max(14px, env(safe-area-inset-bottom));
      }

      @media (max-width: 430px) {
        .my-profile-shell {
          width: calc(100% - 24px);
          padding-left: 18px;
          padding-right: 18px;
        }

        #profileCard {
          max-width: 100%;
        }

        .ig-profile-form {
          padding-left: 0;
          padding-right: 0;
        }

        .ig-profile-field {
          margin-bottom: 20px;
        }

        .ig-profile-actions {
          justify-content: flex-end;
        }
      }

      /* F-0250: Fix iOS date input width in editable profile */
      #editDob,
      #editProfileForm input[type="date"] {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
        display: block;
        text-align: left;
        -webkit-appearance: none;
        appearance: none;
      }

      #editDob::-webkit-date-and-time-value,
      #editProfileForm input[type="date"]::-webkit-date-and-time-value {
        text-align: left;
        min-width: 0;
      }

    </style>

    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>

  <body class="profile-page emotion-dashboard-page ig-theme-default">
    <div class="ig-theme-bg" aria-hidden="true"></div>

    <main class="emotion-dashboard-shell emotion-dashboard-card emotion-dashboard-content-shell my-profile-shell">
      <header class="emotion-dashboard-header">
        <div
          class="emotion-dashboard-icon-btn"
          aria-hidden="true"
          style="visibility:hidden;"
        >
          <span aria-hidden="true">←</span>
        </div>

        <div class="emotion-dashboard-header-copy">
          <p class="emotion-dashboard-kicker"></p>
          <h1 class="emotion-dashboard-title">My Profile</h1>
          <p class="emotion-dashboard-subtitle">
            Your saved account details.
          </p>
        </div>

        <!-- F-0256: sub-page closes to profile with right-side X. -->
        <a
          href="/profile.html"
          class="emotion-dashboard-icon-btn"
          aria-label="Close to profile"
          title="Close"
        >
          <span aria-hidden="true">×</span>
        </a>
      </header>

      <div id="profileCard" hidden>
        <div id="profileReadOnly">
          <dl style="margin: 12px 0 0 0;">
            <div class="ig-row">
              <dt class="ig-dt">Email</dt>
              <dd id="emailVal" class="ig-dd">—</dd>
            </div>

            <div class="ig-row">
              <dt class="ig-dt">First name</dt>
              <dd id="firstNameVal" class="ig-dd">—</dd>
            </div>

            <div class="ig-row">
              <dt class="ig-dt">Last name</dt>
              <dd id="lastNameVal" class="ig-dd">—</dd>
            </div>

            <div class="ig-row">
              <dt class="ig-dt">Date of birth</dt>
              <dd id="dobVal" class="ig-dd">—</dd>
            </div>

            <div class="ig-row">
              <dt class="ig-dt">Gender</dt>
              <dd id="genderVal" class="ig-dd">—</dd>
            </div>
          </dl>

          <div class="ig-profile-actions">
            <button
              id="editProfileBtn"
              type="button"
              class="ig-profile-btn ig-profile-btn-primary"
            >
              Edit
            </button>
          </div>
        </div>

        <form id="editProfileForm" class="ig-profile-form" hidden>
          <div class="ig-profile-field">
            <label>Email</label>
            <p id="editEmailVal" class="ig-profile-email-readonly">—</p>
          </div>

          <div class="ig-profile-field">
            <label for="editFirstName">First name</label>
            <input id="editFirstName" type="text" autocomplete="given-name" />
          </div>

          <div class="ig-profile-field">
            <label for="editLastName">Last name</label>
            <input id="editLastName" type="text" autocomplete="family-name" />
          </div>

          <div class="ig-profile-field">
            <label for="editDob">Date of birth</label>
            <input id="editDob" type="date" />
          </div>

          <div class="ig-profile-field">
            <label for="editGender">Gender</label>
            <select id="editGender">
              <option value="Prefer not to say">Prefer not to say</option>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Non-binary">Non-binary</option>
            </select>
          </div>

          <div class="ig-profile-actions">
            <button
              id="cancelProfileBtn"
              type="button"
              class="ig-profile-btn ig-profile-btn-secondary"
            >
              Cancel
            </button>
            <button
              id="saveProfileBtn"
              type="submit"
              class="ig-profile-btn ig-profile-btn-primary"
            >
              Save
            </button>
          </div>
        </form>

        <p
          id="editStatusLine"
          style="opacity: 0.85; font-size: 12px; margin: 12px 0 0 0;"
          hidden
        ></p>
      </div>

      <div id="authGateCard" hidden>
        <p
          style="
            margin: 14px 0 0 0;
            font-size: 14px;
            line-height: 1.45;
            opacity: 0.9;
          "
        >
          Sign in to view your profile details.
        </p>

        <button
          id="goLoginBtn"
          type="button"
          class="emotion-dashboard-icon-btn"
          style="margin-top: 12px; width: auto; min-width: 120px; padding: 0 14px;"
        >
          Log in
        </button>
      </div>

      <p
        id="statusLine"
        style="opacity: 0.8; font-size: 12px; margin: 12px 0 0 0;"
        hidden
      >
        Loading…
      </p>
    </main>

    <script src="/js/theme.apply.js?v=2026-01-16-2"></script>
    <script src="/js/profile.api.js"></script>
    <script src="/js/my-profile.js?v=2026-05-19-1" defer></script>
    <script src="/js/capacitor.bundle.js"></script>
  </body>
</html>

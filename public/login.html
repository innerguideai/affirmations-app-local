<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • AI AFFIRM</title>

  <!-- Fonts + Global CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=2026-01-01-2" />

  <!-- Login-only centering (no global CSS changes) -->
  <style>
    /* Center the login card vertically */
    body.centered-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    }

    /* Keep the card at a sane width */
    body.centered-page .login-center {
      width: min(92vw, 420px);
      margin: 0 auto;
    }
  </style>

  <!-- Prevent caching -->
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>

<!-- IMPORTANT: class must be EXACTLY "centered-page" -->

<body class="centered-page">
  <main class="container login-center">

    <!-- Brand header -->
    <header style="margin-bottom:14px; text-align:center;">
      <h1 style="margin:0 0 6px;">AI AFFIRM</h1>
      <div class="note" style="opacity:0.9; margin:0;">by InnerGuide</div>
    </header>

    <!-- Status / errors -->
    <p id="loginStatus" class="status note" style="margin:10px 0 14px;"></p>

    <!-- Show-after-signup banner (hidden by default) -->
    <div id="signupSuccess" class="notice success" style="display:none; margin-bottom:12px;" role="status"
      aria-live="polite">
      🎉 Registration successful! You can log in below.
    </div>

    <!-- Google Sign-In -->
    <section style="margin-bottom:16px;">
      <button id="btn-google-login" type="button"
        style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 16px;border:1.5px solid rgba(0,0,0,0.18);border-radius:12px;background:#fff;color:#3c4043;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
    </section>

    <!-- Apple Sign-In -->
    <section style="margin-bottom:10px;">
      <button id="btn-apple-login" type="button"
        style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 16px;border:none;border-radius:12px;background:#000;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;">
        <svg width="17" height="20" viewBox="0 0 814 1000" aria-hidden="true" fill="#fff">
          <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.3-164-39.3c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.7 0 663 0 541.8c0-207.5 135.4-317.3 269-317.3 71 0 130.5 46.4 175 46.4 42.5 0 109.2-49 192.8-49 31.1 0 108.2 2.6 168.6 80.3zm-198.4-108c22.4-26.6 38.4-63.5 38.4-100.4 0-5.2-.6-10.4-1.3-15.6-36.5 1.3-80.3 24.4-106.2 54.3-20.1 23.1-38.4 60-38.4 97.5 0 5.8.6 11.7 1.3 13.6 2.6.6 5.8.6 8.4.6 33.1 0 73.3-22.4 97.8-49.9z"/>
        </svg>
        Sign in with Apple
      </button>
    </section>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <hr style="flex:1;border:none;border-top:1px solid rgba(0,0,0,0.12);" />
      <span class="note" style="font-size:13px;white-space:nowrap;">or sign in with email</span>
      <hr style="flex:1;border:none;border-top:1px solid rgba(0,0,0,0.12);" />
    </div>

    <!-- Email login is visible by default -->
    <section style="margin-top:6px;">
      <h2 style="font-size:16px; margin:0 0 10px; text-align:center;">Login with Email</h2>

      <form id="loginForm" novalidate>
        <input id="email" type="email" placeholder="Email" autocomplete="email" required />
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />

        <button id="loginBtn" type="submit" class="btn btn-primary" style="width:100%;">
          Login
        </button>
      </form>

      <div
        style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap;">
        <a class="link-sm" href="/forgot.html">Forgot password?</a>
        <span class="link-sm">Don’t have an account? <a href="/signup.html">Sign Up</a></span>
      </div>
    </section>

  </main>
  <script>

    console.log("[BOOT] login.html loaded", {
      href: window.location.href,
      ts: new Date().toISOString()
    });

    (async function () {
      try {
        const token = localStorage.getItem("authToken") || "";
        if (!token) return;

        const r = await fetch("http://54.221.158.219:3000/api/me", {
          method: "GET",
          cache: "no-store",
          headers: {
            "Accept": "application/json",
            "Authorization": `Bearer ${token}`
          }
        });

        if (r.ok) {
          // already authenticated → skip login screen
          window.location.replace("/profile.html?v=1");
        }
      } catch (_) { }
    })();
  </script>

  <script>
    /* ── Google Sign-In via Firebase native plugin ─────────────────────────
       Requires ENABLE_FIREBASE_GOOGLE_LOGIN=true on the backend.
       Button is shown/hidden by the server; this is the client handler. ── */
    document.getElementById("btn-google-login")?.addEventListener("click", async function () {
      const statusEl     = document.getElementById("loginStatus");
      const googleBtn    = document.getElementById("btn-google-login");
      const firebaseAuth = window.IG?.FirebaseAuthentication;

      function setStatus(msg, cls) {
        if (!statusEl) return;
        statusEl.textContent = msg;
        statusEl.className   = "status " + cls;
      }

      if (!firebaseAuth) {
        setStatus("Google sign-in requires the native app.", "note");
        return;
      }

      googleBtn.disabled = true;
      googleBtn.textContent = "Signing in…";

      try {
        /* 1. Native Google sign-in sheet */
        const result = await firebaseAuth.signInWithGoogle();

        /* 2. Get Firebase Auth ID token (not the Google OAuth credential token) */
        const tokenResult = await firebaseAuth.getIdToken({ forceRefresh: true });
        const idToken = tokenResult?.token;

        if (!idToken) {
          setStatus("Google sign-in did not return a Firebase token. Please try again.", "error");
          return;
        }

        /* 3. Exchange with AI Affirm backend → innerguide-auth */
        const res  = await fetch("http://54.221.158.219:3000/api/auth/firebase", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ idToken }),
        });

        const data = await res.json();

        if (!res.ok) {
          setStatus(data.error || "Sign-in failed. Please try again.", "error");
          return;
        }

        /* 3. Persist session
           data.token              — JWT signed by innerguide-auth
           data.user.globalUserId  — canonical user ID
           data.user.appUserId     — AI Affirm local _id (key for all app data)
           data.user.*             — email, name, avatarUrl, plan, etc.       */
        const user = data.user || {};

        localStorage.setItem("authToken",      data.token);
        localStorage.setItem("currentUserId",  user.appUserId  || "");
        localStorage.setItem("currentUser",    JSON.stringify({
          ...user,
          _id: user.appUserId,   // app code reads ._id in some places
          id:  user.appUserId,
        }));
        localStorage.setItem("ig_auth_mode",   "account");
        localStorage.setItem("ig_guest_start", "");
        localStorage.setItem("ig_guest_expiry","");

        window.location.replace("/profile.html");

      } catch (err) {
        console.error("[google login]", err);
        // User cancelled the native sheet — no error banner needed
        if (!err?.message?.includes("cancel")) {
          setStatus("Google sign-in failed. Please try again.", "error");
        }
      } finally {
        googleBtn.disabled = false;
        googleBtn.textContent = "Continue with Google";
      }
    });
  </script>

  <script>
    /* ── Apple Sign-In via Firebase native plugin ──────────────────────────
       Requires ENABLE_FIREBASE_APPLE_LOGIN=true on the backend.
       Uses same session storage pattern as Google Sign-In. ── */
    (function () {
      const appleBtn0      = document.getElementById("btn-apple-login");
      const APPLE_BTN_HTML = appleBtn0 ? appleBtn0.innerHTML : "";

      appleBtn0?.addEventListener("click", async function () {
        const statusEl     = document.getElementById("loginStatus");
        const appleBtn     = document.getElementById("btn-apple-login");
        const firebaseAuth = window.IG?.FirebaseAuthentication;

        function setStatus(msg, cls) {
          if (!statusEl) return;
          statusEl.textContent = msg;
          statusEl.className   = "status " + cls;
        }

        if (!firebaseAuth) {
          setStatus("Apple sign-in requires the native app.", "note");
          return;
        }

        appleBtn.disabled    = true;
        appleBtn.textContent = "Signing in…";

        try {
          /* 1. Native Apple sign-in sheet */
          await firebaseAuth.signInWithApple();

          /* 2. Get Firebase Auth ID token */
          const tokenResult = await firebaseAuth.getIdToken({ forceRefresh: true });
          const idToken     = tokenResult?.token;

          if (!idToken) {
            setStatus("Apple sign-in did not return a token. Please try again.", "error");
            return;
          }

          /* 3. Exchange with AI Affirm backend → innerguide-auth */
          const res  = await fetch("http://54.221.158.219:3000/api/auth/firebase", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ idToken }),
          });

          const data = await res.json();

          if (!res.ok) {
            setStatus(data.error || "Sign-in failed. Please try again.", "error");
            return;
          }

          /* 4. Persist session — mirrors Google Sign-In storage exactly */
          const user = data.user || {};

          localStorage.setItem("authToken",       data.token);
          localStorage.setItem("currentUserId",   user.appUserId  || "");
          localStorage.setItem("currentUser",     JSON.stringify({
            ...user,
            _id: user.appUserId,
            id:  user.appUserId,
          }));
          localStorage.setItem("ig_auth_mode",    "account");
          localStorage.setItem("ig_guest_start",  "");
          localStorage.setItem("ig_guest_expiry", "");

          window.location.replace("/profile.html");

        } catch (err) {
          console.error("[apple login]", err);
          /* User cancelled the native sheet — no error banner needed */
          if (!err?.message?.includes("cancel")) {
            setStatus("Apple sign-in failed. Please try again.", "error");
          }
        } finally {
          appleBtn.disabled = false;
          if (APPLE_BTN_HTML) appleBtn.innerHTML = APPLE_BTN_HTML;
        }
      });
    })();
  </script>

  <!-- Guest + login behavior -->
  <script src="/js/login-guest.js?v=2026-01-01-2" defer></script>
  <script src="/js/login.js?v=2026-01-01-3" defer></script>

  <script src="/js/capacitor.bundle.js"></script>
</body>

</html>

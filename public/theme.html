<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theme • AI AFFIRM</title>

  <link rel="stylesheet" href="/css/style.css?v=2026-05-22-1" />
  <link rel="stylesheet" href="/css/profile.css?v=2026-03-25-2" />
  <link rel="stylesheet" href="/css/emotion-dashboard.css?v=2026-03-25-2" />

  <script src="/js/theme.apply.js?v=2026-05-22-1"></script>

  <style>
	body.profile-page::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: color-mix(in srgb, var(--theme-surface-light) 70%, transparent);
}

  .theme-page-shell {
	  padding:
	    calc(env(safe-area-inset-top, 0px) + 16px)
	    16px
	    calc(env(safe-area-inset-bottom, 0px) + 16px);
	  background: transparent;
	  box-shadow: none;
	  border: 0;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}


.theme-page-shell {
  position: relative;
  z-index: 1;
}
    .theme-page-body {
      display: grid;
      gap: 10px;
    }

    .theme-page-intro {
      padding: 0 2px;
    }

    .theme-page-intro-title {
      margin: 0 0 4px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-strong, #1f2937);
    }

    .theme-page-intro-copy {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.45;
      color: var(--text-muted, rgba(0, 0, 0, 0.65));
    }
.theme-list {
  display: grid;
  grid-template-columns: repeat(2, 136px);
  gap: 10px;
  justify-content: center;
  margin: 0 auto;
}

    .theme-tile {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.1);
      min-height: 0;
      aspect-ratio: 0.56;
    }

	    .theme-img {
	      width: 100%;
	      height: 100%;
	      object-fit: cover;
	      object-position: center top;
	      display: block;
	    }

	    .theme-tile[data-theme="ig-theme-default"] .theme-img {
	      object-position: center 22%;
	    }

	    .theme-tile[data-theme="ig-theme-winter"] .theme-img {
	      object-position: center 18%;
	    }

	    .theme-tile[data-theme="ig-theme-spring"] .theme-img {
	      object-position: center 20%;
	    }

	    .theme-tile[data-theme="ig-theme-cblossom"] .theme-img {
	      object-position: center 18%;
	    }

	    .theme-tile[data-theme="ig-theme-summer"] .theme-img {
	      object-position: center 30%;
	    }

	    .theme-tile[data-theme="ig-theme-zen"] .theme-img {
	      object-position: center 24%;
	    }

	    .theme-tile[data-theme="ig-theme-practical"] .theme-img {
	      object-position: center 20%;
	    }

    .theme-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.48) 0%,
        rgba(0, 0, 0, 0.20) 42%,
        rgba(0, 0, 0, 0.08) 100%
      );
    }

    .theme-text {
      min-width: 0;
      color: #fff;
    }

    .theme-name {
      margin: 0;
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .theme-desc {
      margin: 4px 0 0;
      font-size: 0.74rem;
      line-height: 1.2;
      opacity: 0.95;
    }

    .theme-action {
      flex-shrink: 0;
      min-width: 0;
      border: 0;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 0.76rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.88);
      color: #1f2937;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.14);
      cursor: pointer;
      align-self: flex-start;
    }

    .theme-action.selected {
      background: rgba(147, 183, 123, 0.95);
      color: #fff;
    }

    .theme-action:active {
      transform: scale(0.98);
    }

	    @media (max-width: 640px) {
	      .theme-page-shell {
	        padding-left: 16px;
	        padding-right: 16px;
	      }

      .theme-overlay {
        padding: 9px;
      }

      .theme-name {
        font-size: 0.9rem;
      }

      .theme-desc {
        font-size: 0.7rem;
      }

      .theme-action {
        padding: 5px 10px;
        font-size: 0.72rem;
      }
    }
  </style>
</head>

<body class="profile-page emotion-dashboard-page ig-theme-default">
  <div class="ig-theme-bg" aria-hidden="true"></div>

  <main class="emotion-dashboard-shell emotion-dashboard-card emotion-dashboard-content-shell theme-page-shell">
   <header class="emotion-dashboard-header">
  <div
    class="emotion-dashboard-icon-btn"
    aria-hidden="true"
    style="visibility:hidden;"
  >
    <span aria-hidden="true">←</span>
  </div>

  <div class="emotion-dashboard-header-copy">
    <p class="emotion-dashboard-kicker"></p>
    <h1 class="emotion-dashboard-title">Themes</h1>
    <p class="emotion-dashboard-subtitle">
      Pick the look you want across the app.
    </p>
  </div>

  <!-- F-0283: theme page closes with X to match newer app navigation pattern. -->
  <a
    href="/profile.html"
    class="emotion-dashboard-icon-btn"
    aria-label="Close themes"
    title="Close"
  >
    <span aria-hidden="true">×</span>
  </a>
</header>

    <section class="theme-page-body">
      <section class="theme-list" aria-label="Theme options">
        <article class="theme-tile" data-theme="ig-theme-default">
          <img
            class="theme-img"
            src="/images/default.jpg"
            alt="Default theme preview"
          />
          <div class="theme-overlay">
            <div class="theme-text">
              <p class="theme-name">Default</p>
              <p class="theme-desc">Soft and balanced</p>
            </div>
            <button class="theme-action" type="button" data-use="ig-theme-default">
              Use
            </button>
          </div>
        </article>

        <article class="theme-tile" data-theme="ig-theme-winter">
          <img
            class="theme-img"
            src="/images/winter.jpg"
            alt="Winter theme preview"
          />
          <div class="theme-overlay">
            <div class="theme-text">
              <p class="theme-name">Winter</p>
              <p class="theme-desc">Cool and calm</p>
            </div>
            <button class="theme-action" type="button" data-use="ig-theme-winter">
              Use
            </button>
          </div>
        </article>

        <article class="theme-tile" data-theme="ig-theme-spring">
          <img
            class="theme-img"
            src="/images/spring.jpg"
            alt="Spring theme preview"
          />
          <div class="theme-overlay">
            <div class="theme-text">
              <p class="theme-name">Spring</p>
              <p class="theme-desc">Fresh and light</p>
            </div>
            <button class="theme-action" type="button" data-use="ig-theme-spring">
              Use
            </button>
          </div>
        </article>

        <article class="theme-tile" data-theme="ig-theme-cblossom">
          <img
            class="theme-img"
            src="/images/cblossom.jpg"
            alt="Cherry Blossom theme preview"
          />
          <div class="theme-overlay">
            <div class="theme-text">
              <p class="theme-name">Cherry Blossom</p>
              <p class="theme-desc">Soft and airy</p>
            </div>
            <button class="theme-action" type="button" data-use="ig-theme-cblossom">
              Use
            </button>
          </div>
        </article>

        <article class="theme-tile" data-theme="ig-theme-summer">
          <img
            class="theme-img"
            src="/images/summerbeach.jpg"
            alt="Summer Beach theme preview"
          />
          <div class="theme-overlay">
            <div class="theme-text">
              <p class="theme-name">Summer Beach</p>
              <p class="theme-desc">Bright and warm</p>
            </div>
            <button class="theme-action" type="button" data-use="ig-theme-summer">
              Use
            </button>
          </div>
        </article>

        <article class="theme-tile" data-theme="ig-theme-zen">
          <img
            class="theme-img"
            src="/images/zengarden.jpg"
            alt="Zen Garden theme preview"
          />
          <div class="theme-overlay">
            <div class="theme-text">
              <p class="theme-name">Zen Garden</p>
              <p class="theme-desc">Quiet and grounded</p>
            </div>
            <button class="theme-action" type="button" data-use="ig-theme-zen">
              Use
            </button>
          </div>
        </article>

        <article class="theme-tile" data-theme="ig-theme-practical">
          <img
            class="theme-img"
            src="/images/practical.jpg"
            alt="Practical theme preview"
          />
          <div class="theme-overlay">
            <div class="theme-text">
              <p class="theme-name">Practical</p>
              <p class="theme-desc">Calm and focused</p>
            </div>
            <button class="theme-action" type="button" data-use="ig-theme-practical">
              Use
            </button>
          </div>
        </article>
      </section>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "ig_theme";
      const THEMES = [
        "ig-theme-default",
        "ig-theme-winter",
        "ig-theme-spring",
        "ig-theme-cblossom",
        "ig-theme-summer",
        "ig-theme-zen",
        "ig-theme-practical"
      ];

      function getSavedTheme() {
        try {
          const value = localStorage.getItem(STORAGE_KEY);
          return THEMES.includes(value) ? value : "ig-theme-default";
        } catch (err) {
          return "ig-theme-default";
        }
      }

      function setSavedTheme(themeValue) {
        try {
          localStorage.setItem(STORAGE_KEY, themeValue);
        } catch (err) {
          console.warn("[theme] failed to save theme", err);
        }
      }

      function paintSelectedState() {
        const activeTheme = getSavedTheme();
        const buttons = document.querySelectorAll(".theme-action[data-use]");

        buttons.forEach((button) => {
          const thisTheme = button.getAttribute("data-use");
          const isSelected = thisTheme === activeTheme;

          button.classList.toggle("selected", isSelected);
          button.textContent = isSelected ? "Selected" : "Use";
          button.setAttribute("aria-pressed", isSelected ? "true" : "false");
        });
      }

      document.addEventListener("click", function (event) {
        const button = event.target.closest(".theme-action[data-use]");
        if (!button) return;

        const themeValue = button.getAttribute("data-use");
        if (!THEMES.includes(themeValue)) return;

        setSavedTheme(themeValue);
        paintSelectedState();

        setTimeout(() => {
          window.location.href = "/profile.html";
        }, 120);
      });

      paintSelectedState();
    })();
  </script>

  <script src="/js/capacitor.bundle.js"></script>
</body>
</html>

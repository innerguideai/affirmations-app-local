<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script>
console.log("[IG][RESET] local reset.html loaded");
</script>

<title>Reset Password • InnerGuide AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/style.css"/>

<meta http-equiv="Cache-Control" content="no-store"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
</head>

<body>

<main class="container" style="margin:8vh auto;">

<h1>Reset your password</h1>

<p id="resetStatus" class="status note" style="margin:10px 0 14px;">
Validating reset link…
</p>

<form id="resetForm" novalidate>

<input id="newPassword"
type="password"
minlength="8"
placeholder="New password"
autocomplete="new-password"
required/>

<input id="confirmPassword"
type="password"
minlength="8"
placeholder="Confirm password"
autocomplete="new-password"
required/>

<button id="resetSubmit"
type="submit"
class="btn btn-primary">
Update password
</button>

</form>

<p class="note" style="margin-top:14px;color:#666;">
Tip: Password must be at least 8 characters.
</p>

<div id="resetSuccess" style="display:none;margin-top:18px;">

<p style="margin:0 0 12px 0;">
Password updated successfully.
</p>

<a href="/login.html"
class="btn btn-primary"
style="display:inline-block;margin-top:8px;">
Go to Login
</a>

<p class="note" style="margin-top:12px;color:#666;">
You can now sign in with your new password.
</p>

</div>

</main>

<script src="/js/reset.js" defer></script>

</body>
</html>

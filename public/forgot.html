<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password • InnerGuide AI</title>

  <!-- Fonts + Global CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=2025-10-24-2" />

  <!-- Forgot-only centering (no global CSS changes) -->
  <style>
    body.centered-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px
               calc(env(safe-area-inset-bottom, 0px) + 16px);
    }

    body.centered-page .forgot-center {
      width: min(92vw, 420px);
      margin: 0 auto;
    }
  </style>

  <!-- Prevent caching -->
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>

<body class="centered-page">
  <main class="container forgot-center">
    <h1>Forgot your password?</h1>
    <p class="note" style="margin:8px 0 14px;">
      Enter your email and we’ll send you a reset link.
    </p>

    <!-- Status line -->
    <p id="forgotStatus" class="status note" style="min-height:1.5em;margin:6px 0 14px;"></p>

    <!-- Form (IDs expected by forgot.js) -->
    <form id="forgotForm" novalidate autocomplete="off">
      <input id="forgotEmail" type="email" placeholder="you@example.com" autocomplete="email" required />
      <button id="forgotSubmit" type="submit" class="btn btn-primary">
        Send reset email
      </button>
    </form>

    <p class="note" style="text-align:center;margin-top:14px;">
      If your email exists in our system, you’ll receive a reset link within a minute.
    </p>

    <p style="text-align:center;margin-top:12px;">
      <a class="link-sm" href="/login.html">← Back to login</a>
    </p>
  </main>

  <!-- Modular JS -->
  <script src="/js/forgot.js?v=2025-10-24-1" defer></script>
  <script src="/js/capacitor.bundle.js"></script>
</body>
</html>
